<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>">
  <title>AISCM - 회원 등록 시스템</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <span class="badge">Supabase Connected</span>
      <h1>AISCM 회원 등록</h1>
      <p>신규 회원 정보(이름, 이메일, 전화번호)를 등록하세요.</p>
    </header>

    <!-- Registration Card -->
    <section class="card">
      <h2 class="card-title">회원 정보 입력</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">이름</label>
          <div class="input-wrap">
            <input type="text" id="name" placeholder="홍길동" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="email">이메일</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="user@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="phone">전화번호</label>
          <div class="input-wrap">
            <input type="tel" id="phone" placeholder="010-1234-5678" maxlength="13" required autocomplete="tel">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span>등록하기</span>
        </button>

        <div id="alertBox" class="alert" role="alert"></div>
      </form>
    </section>

    <!-- Member List Card -->
    <section class="card">
      <div class="card-title">
        <span>등록된 회원 목록</span>
        <span id="memberCount" class="count-badge">0명</span>
      </div>
      <div id="memberList" class="member-list">
        <div class="empty-state">불러오는 중...</div>
      </div>
    </section>

    <footer class="footer">
      <p>&copy; 2026 AISCM Project &bull; Powered by Supabase</p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
